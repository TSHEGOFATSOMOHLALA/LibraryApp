<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Office</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Verdana, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #2d3436;
        }

        .navbar {
            background-color: #1f3c58;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .brand a {
            color: white;
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            background-color: #2f5d7c;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #3f7599;
        }

        .welcome {
            color: #dfeaf3;
            font-size: 14px;
            margin-right: 6px;
        }

        .page-wrapper {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .content-card {
            background-color: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        h1, h2, h3 {
            color: #1f3c58;
            margin-top: 0;
        }

        p {
            line-height: 1.6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #eaf1f7;
            color: #1f3c58;
            font-weight: bold;
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d9e2ec;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ecf0f1;
        }

        tr:hover {
            background-color: #f9fbfd;
        }

        .btn,
        input[type="submit"],
        button {
            display: inline-block;
            background-color: #2f80ed;
            color: white;
            text-decoration: none;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .btn:hover,
        input[type="submit"]:hover,
        button:hover {
            background-color: #1c68cf;
        }

        .btn-edit {
            background-color: #27ae60;
        }

        .btn-edit:hover {
            background-color: #1f8c4d;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        form {
            margin-top: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            margin-bottom: 16px;
            border: 1px solid #ccd6dd;
            border-radius: 8px;
            font-size: 14px;
        }

        label {
            font-weight: bold;
            color: #34495e;
        }

        .footer {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            padding: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 16px 20px;
            }

            .brand {
                margin-bottom: 12px;
            }

            .content-card {
                padding: 20px;
            }

            .nav-links {
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">
            <a href="{% url 'vetoffice:home' %}">Vet Office</a>
        </div>

        <div class="nav-links">
            <a href="{% url 'vetoffice:home' %}">Home</a>
            <a href="{% url 'vetoffice:ownerlist' %}">Owners</a>
            <a href="{% url 'vetoffice:patientlist' %}">Patients</a>

            {% if user.is_authenticated %}
                <span class="welcome">Welcome, {{ user.username }}</span>
                <a href="{% url 'vetoffice:logout' %}">Log Out</a>
            {% else %}
                <a href="{% url 'login' %}?next={% url 'vetoffice:home' %}">Log In</a>
                <a href="{% url 'vetoffice:signup'%}?next={% url 'login' %}">Sign Up</a>
            {% endif %}
        </div>
    </div>

    <div class="page-wrapper">
        <div class="content-card">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <div class="footer">
        Vet Office Management System
    </div>

</body>
</html>
