{% extends 'EventApp/base.html' %}



{% block title %}Event List - EventApp{% endblock %}



{% block content %}

<h2>Event List</h2>



<table>

  <tr>

    <th>Name</th>

    <th>Type</th>

    <th>Date</th>



  </tr>

  {% for event in events %}

  <tr>

    <td>{{event.name }}</td>

    <td>{{event.event_type }}</td>

    <td>{{event.event_date}}</td>



  </tr>

  {% empty %}

  <tr><td colspan="4">No events registered.</td></tr>

  {% endfor %}

</table>

{% endblock %}
