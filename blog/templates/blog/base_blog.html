<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Blog{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="{% url 'blog_home' %}">My Awesome Blog</a></h1>
            <nav>
                <a href="{% url 'blog_home' %}">Home</a>
                <a href="{% url 'post_list' %}">All Posts</a>
            </nav>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
