{% extends 'libraryapp/base.html' %}
{% block content %}

<h2>Book List</h2>
<a href="{% url 'libraryapp:bookcreate' %}"><button class="btn">Add Book</button></a>
<table id="books">
  <tr>
    <th>Title</th>
    <th>Publication Year</th>
      <th>Genre</th>
      <th>Author</th>
      <th> </th>
      <th> </th>
  </tr>
  {% for book in book_list %}
  <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.publication_year }}</td>
      <td>{{ book.genre }}</td>
      <td>{{ book.author }}</td>

      <td><a href="{% url 'libraryapp:bookupdate' book.id %}"><button>Edit</button></a></td>
      <td><a href="{% url 'libraryapp:bookdelete' book.id %}"><button>Delete</button></a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
