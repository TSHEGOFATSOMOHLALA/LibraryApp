{% extends 'libraryapp/base.html' %}
{% block content %}

<h2>Author List</h2>
<a href="{% url 'libraryapp:authorcreate' %}"><button class="btn">Add Author</button></a>
<table id="authors">
  <tr>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
      <th> </th>
      <th> </th>
  </tr>
  {% for author in author_list %}
  <tr>
      <td>{{ author.first_name }}</td>
      <td>{{ author.last_name }}</td>
      <td>{{ author.email }}</td>
      <td><a href="{% url 'libraryapp:authorupdate' author.id %}"><button>Edit</button></a></td>
      <td><a href="{% url 'libraryapp:authordelete' author.id %}"><button>Delete</button></a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
