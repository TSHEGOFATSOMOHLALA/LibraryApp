{% extends "carehome/base.html" %}

{% block content %}
<h2>Resident List</h2>
<ul>
    {% for resident in residents %}
        <li>{{ resident.resident_name }} {{ resident.resident_surname }} (Code: {{ resident.resident_code }})</li>
    {% empty %}
        <li>No residents available.</li>
    {% endfor %}
</ul>
{% endblock %}
